name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true
      # یہاں اسپیس ٹھیک کر دی گئی ہے (create کے بعد اسپیس، پھر ڈاٹ)
      - run: flutter create . --project-name smart_bulb --platforms android
      - run: flutter pub get
      - name: Add Bluetooth Permissions
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          # Agar permission pehle se nahi hai to <manifest> ke neeche inject karo
          grep -q "BLUETOOTH_CONNECT" $FILE || sed -i 's/<manifest.*>/&\n <uses-permission android:name="android.permission.BLUETOOTH" \/>\n <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" \/>\n <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>/' $FILE
          cat $FILE
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Bulb-APK
          path: build/app/outputs/flutter-apk/app-release.apk
